apiVersion: apps/v1
kind: Deployment
metadata:
  name: poker-frontend
  labels:
    app: poker-app
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poker-app
      component: frontend
  template:
    metadata:
      labels:
        app: poker-app
        component: frontend
    spec:
      containers:
      - name: frontend
        image: gcr.io/mexpoker/poker-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
