apiVersion: apps/v1
kind: Deployment
metadata:
  name: poker-backend
  labels:
    app: poker-app
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: poker-app
      component: backend
  template:
    metadata:
      labels:
        app: poker-app
        component: backend
    spec:
      containers:
      - name: backend
        image: gcr.io/mexpoker/poker-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
